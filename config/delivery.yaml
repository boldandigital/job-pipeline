# ╔═══════════════════════════════════════════════════════════════════════╗
# ║  DAILY DELIVERY — Discord config (ADOPT-8)                            ║
# ║                                                                      ║
# ║  Picked up by scripts/lars-daily-run.sh → sends summary + ZIP to     ║
# ║  Discord via the SAME Hermes bot that powers the assistant. Loaded   ║
# ║  by the wrapper, NOT by batch_pipeline.py.                            ║
# ║                                                                      ║
# ║  Secrets are NOT here — DISCORD_BOT_TOKEN + DISCORD_CHANNEL_ID live  ║
# ║  in `~/.hermes/.env` (gitignored). This file only carries framing +   ║
# ║  limits + a mode selector. See docs/SECRETS.md for the cross-project  ║
# ║  secret-sharing pattern.                                              ║
# ║                                                                      ║
# ║  Mode resolution (set automatically by lars-daily-run.sh):           ║
# ║    • bot     — DISCORD_BOT_TOKEN + DISCORD_CHANNEL_ID present        ║
# ║    • webhook — only DISCORD_WEBHOOK_URL present (legacy fallback)     ║
# ║    • both    — bot wins, webhook ignored                              ║
# ╚═══════════════════════════════════════════════════════════════════════╝
discord:
  enabled: true                              # flip to false to mute without uninstalling cron

  # ─────────────────────────────────────────────────────────────────
  # Delivery mode — env-gated by the wrapper (don't change this by hand)
  #   bot     → POST /channels/{id}/messages with Bot token (default, ADOPT-8)
  #   webhook → POST {webhook_url} (ADOPT-7 fallback)
  # The wrapper inspects env vars and picks one; this value is informational.
  # ─────────────────────────────────────────────────────────────────
  mode: bot

  # ─────────────────────────────────────────────────────────────────
  # Bot-mode credentials (READ-ONLY references — secrets live in ~/.hermes/.env)
  # lars-daily-run.sh will:
  #   1. Source job-pipeline/.env first
  #   2. Fall back to ~/.hermes/.env for any missing DISCORD_* var
  #   3. Default DISCORD_CHANNEL_ID to DISCORD_HOME_CHANNEL if blank
  # ─────────────────────────────────────────────────────────────────
  bot:
    token_env: DISCORD_BOT_TOKEN             # OAuth Bot token (NEVER commit the value)
    channel_id_env: DISCORD_CHANNEL_ID       # numeric snowflake; defaults to DISCORD_HOME_CHANNEL
    api_base: https://discord.com/api/v10    # Discord REST API v10

  # ─────────────────────────────────────────────────────────────────
  # Webhook-mode fallback (ADOPT-7 — kept for the dome317 Docker path)
  # Used only when no bot creds are present. Disable by clearing the env var.
  # ─────────────────────────────────────────────────────────────────
  webhook:
    url_env: DISCORD_WEBHOOK_URL             # webhook URL (NEVER commit the value)

  # Display-name override (both modes honor this)
  username_env: DISCORD_USERNAME             # optional

  # ─────────────────────────────────────────────────────────────────
  # Daily summary message framing
  # ─────────────────────────────────────────────────────────────────
  message:
    greeting: "Ahoy ⚓ Daily batch is in."
    include_dashboard_link: true
    dashboard_url: "http://127.0.0.1:8080"    # localhost-only; tunnel if remote
    top_n_jobs_in_summary: 5
    include_overview_md: false                # attach OVERVIEW.md? (extra request)
    # Discord lets us use rich embeds — leave color null for the default
    # sidebar accent. 0x1ABC9C is a teal that pairs nicely with the ⚓ vibe.
    embed_color: null

  # ─────────────────────────────────────────────────────────────────
  # Document delivery (batch ZIP attachment)
  # NOTE: Discord bot API caps files at 25 MB; webhooks cap at 8 MB / 50 MB
  # depending on Nitro boosts. Bot is the default — keep headroom under 24.
  # ─────────────────────────────────────────────────────────────────
  documents:
    attach_zip: true
    max_zip_size_mb: 24                       # Discord cap = 25 MB; keep headroom
    min_score_to_include: 20                  # skip batched jobs below this score
    max_jobs_per_batch: 50
    # If a batch ever nears the 25 MB cap, split the ZIP into chunks OR
    # upload to S3 and send the link instead. See docs/DAILY-RUN.md §3.

  # ─────────────────────────────────────────────────────────────────
  # Schedule metadata (informational — actual schedule lives in crontab)
  # ─────────────────────────────────────────────────────────────────
  schedule:
    local_time: "09:00"
    timezone: "Europe/Brussels"
    note: "Cron uses local time on macOS, so 09:00 = 09:00 Brussels."

  # ─────────────────────────────────────────────────────────────────
  # Log retention — cron is silent, so wrapper handles its own rotation
  # ─────────────────────────────────────────────────────────────────
  logs:
    dir: "./logs"
    daily_keep: 14                            # days of daily logs / batch logs to keep
    error_keep: 30

# ╔═══════════════════════════════════════════════════════════════════════╗
# ║  GOOGLE SHEET DELIVERY — ADOPT-10 (write) + ADOPT-11 (read)            ║
# ║                                                                      ║
# ║  Daily batch lands in a per-date tab on Lars's "Job Pipeline" Sheet.  ║
# ║  Reuses the same Hermes service account as gpl-love (no new secret).  ║
# ║  Activated by `--sheet` flag on scripts/lars-daily-run.sh.            ║
# ║  Read back (approval loop) by ADOPT-11 sync_approvals — separate      ║
# ║  module, same Sheet, same row schema.                                 ║
# ╚═══════════════════════════════════════════════════════════════════════╝
sheet:
  enabled: false                              # opt-in via --sheet flag; cron leaves it off
  tab_format: "YYYY-MM-DD"                    # per-day tab name (e.g. 2026-09-28)
  idempotent: true                            # re-running overwrites the day's data block

  # Where the Sheet lives. The ID is from the URL (between /d/ and /edit).
  # When empty, --sheet silently skips (cron-safe — won't break the run).
  spreadsheet_id_env: GOOGLE_SPREADSHEET_ID

  # Service account auth. Default points at the Hermes-shared SA at
  # ~/.hermes/credentials/google-service-account.json. The SA needs Editor
  # access on the spreadsheet (share it once with the SA's client_email).
  sa_path_env: GOOGLE_APPLICATION_CREDENTIALS
  sa_default_path: ~/.hermes/credentials/google-service-account.json

  # Read scopes — spreadsheets only (no Drive, no Gmail).
  scope: "https://www.googleapis.com/auth/spreadsheets"

  # Row schema (write side). Mirrors DEFAULT_HEADERS_EN in src/sheet/google_writer.py.
  # ADOPT-11 reads the same columns back to populate jobs.status / rejection_reason.
  headers:
    - date_added
    - source
    - title
    - company
    - location
    - score
    - llm_score
    - url
    - career_url
    - description
    - status          # filled in by Lars during review
    - rejection_reason

  # Description column — keep the sheet snappy. Long descriptions get
  # truncated at DESC_MAX_CHARS + "...". Full text lives at the URL.
  description_max_chars: 500

  # Selection (must match batch_pipeline.py defaults so the Sheet shows the
  # same rows the Discord summary references).
  selection:
    limit: 50
    min_score: 20
    exclude_statuses:                         # don't re-show terminal jobs
      - applied
      - filtered_out
      - batched
      - skipped
