# ╔═══════════════════════════════════════════════════════════════════════╗
# ║  DAILY DELIVERY — Discord webhook config (Lars's Mac, ADOPT-7)         ║
# ║                                                                      ║
# ║  Picked up by scripts/lars-daily-run.sh → sends summary + ZIP via     ║
# ║  Discord webhooks. Loaded by the wrapper, NOT by batch_pipeline.py.   ║
# ║                                                                      ║
# ║  Secrets are NOT here — DISCORD_WEBHOOK_URL lives in `.env`           ║
# ║  (gitignored). This file only carries framing + limits.               ║
# ╚═══════════════════════════════════════════════════════════════════════╝

discord:
  enabled: true                              # flip to false to mute without uninstalling cron

  # Daily summary message framing
  message:
    greeting: "Ahoy ⚓ Daily batch is in."
    include_dashboard_link: true
    dashboard_url: "http://127.0.0.1:8080"    # localhost-only; tunnel if remote
    top_n_jobs_in_summary: 5
    include_overview_md: false                # attach OVERVIEW.md? (extra request)
    # Discord lets us use rich embeds — leave color null for the default
    # sidebar accent. 0x1ABC9C is a teal that pairs nicely with the ⚓ vibe.
    embed_color: null

  # Document delivery
  documents:
    attach_zip: true
    max_zip_size_mb: 24                       # Discord webhook cap = 25MB; keep headroom
    min_score_to_include: 20                  # skip batched jobs below this score
    max_jobs_per_batch: 50

  # Schedule metadata (informational — actual schedule lives in crontab)
  schedule:
    local_time: "09:00"
    timezone: "Europe/Brussels"
    note: "Cron uses local time on macOS, so 09:00 = 09:00 Brussels."

  # Log retention — cron is silent, so wrapper handles its own rotation
  logs:
    dir: "./logs"
    daily_keep: 14                            # days of daily logs / batch logs to keep
    error_keep: 30