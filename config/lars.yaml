    # ── WORK-LIFE / CULTURE FIT ────────────────────────────
    four_day_week: 90
    async_culture: 90
    flexible_hours: 60
    autonomy_culture: 80
    results_only: 90
    unlimited_pto: 40

    # ── COMPENSATION ───────────────────────────────────────
    salary_above_target: 100        # Ye's floor €65k, target €65-75k IC band
    equity_options: 60
