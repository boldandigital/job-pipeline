# ============================================================
# SCORING WEIGHTS — tuned for Lars
# ============================================================
# Strategy:
#   - Geography: DACH + Benelux + European remote are HEAVILY boosted
#   - Seniority/leadership: founder, CTO, VP, Head, Director are HEAVILY boosted
#   - Domain fit: hosting, devops, agency, branding, salesforce, marketing
#     strategy — all boosted
#   - Negative signals: junior/entry/intern hard-rejected, on-site-with-no-remote
#     heavily penalised
#   - The 4-tier Premium/Standard/Low/Filtered thresholds remain so dashboard
#     tiers (150+ / 80-149 / 20-79 / <20) survive.
scoring:
  threshold: 20

  weights:

    # ── GEOGRAPHY (highest priority) ────────────────────────
    # Boost DACH + Benelux hard, demote US/Asia-only.
    europe_remote: 200
    dach_benelux_local: 180
    preferred_city: 160          # Berlin, Munich, Hamburg, Vienna,
                                 # Zurich, Brussels, Amsterdam, Leuven
    remote_europe: 160
    remote_dach: 200             # stronger than generic remote_europe
    remote_benelux: 180
    german_language: 120         # bilingual DE/EN — German is a must-have

    # ── SENIORITY (HEAVY boost — Lars is targeting these) ──
    # These are the exact titles Lars wants. Dome317's apply_filter.py
    # hard-blocks them — see config.md. Once filter is fixed, these
    # weights will surface Founder/CTO roles at top of stack.
    founder: 250
    c_level: 220
    cto_role: 240
    vp_role: 180
    head_of_role: 200
    director_role: 170
    principal_role: 150
    lead_role: 140
    senior_role: 110
    mid_role: 90                    # NEW: matches Ye's mid+senior+C-level scope
    digital_consultant: 220         # NEW: highest weight — Ye's #1 lane 2026-09-30
    contractor: 110                 # NEW: matches IC / freelance lanes
    marketing_sales_bd: 180         # NEW: matches Ye's marketing/sales/BD CV lanes
    international: 160              # NEW: matches Ye's 6y Shanghai + trade fair lanes

    # ── DOMAIN FIT (Lars's actual skill set) ───────────────
    # Boost categories that map directly to his CV
    web_hosting: 180
    managed_hosting: 200
    cloud_infrastructure: 170
    devops_leadership: 160
    agency_management: 170
    branding_strategy: 150
    market_positioning: 130
    pricing_strategy: 100
    salesforce_implementation: 140
    ecommerce_leadership: 130
    international_growth: 140
    team_5_to_15: 80
