# ║                                                                              ║
# ║  Profile: 12+ years in digital agency + cloud hosting founder.               ║
# ║           Targeting Founder / CTO / Head-of-Digital / VP Eng.                 ║
# ║                                                                              ║
# ║  Geography: DACH (DE/AT/CH) + Benelux (BE/NL/LU) + global remote.            ║
