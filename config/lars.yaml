#
# NOTE: This config tunes the *keyword-based* stage (score_jobs.py) only.
# dome317's llm_scorer.py's baked-in system prompt still favours entry-level
# candidates (penalises "senior leadership") — that requires a code change
# outside this card's scope. Tracked as risk in config.md.
# Also: apply_filter.py hard-blocks Senior/Lead/CTO titles — THAT IS ALSO A
# CODE CHANGE OUTSIDE THIS CARD'S SCOPE. Tracked in config.md as the #1
# blocking issue for adoption.

# ============================================================
# SEARCH CONFIGURATION
# ============================================================
search:
  sites:
    - "indeed"
    - "linkedin"

  locations:
    # Belgium base
    - "Brussels, Belgium"
    - "Leuven, Belgium"           # Lars lives in Aarschot (near Leuven)
    - "Aarschot, Belgium"
    - "Antwerp, Belgium"
    - "Ghent, Belgium"
    # Luxembourg
    - "Luxembourg City, Luxembourg"
    - "Luxembourg"
    # Rhein-Main area (Cologne, Düsseldorf, Frankfurt)
    - "Cologne, Germany"
    - "Köln, Germany"
    - "Düsseldorf, Germany"
    - "Frankfurt, Germany"
    - "Frankfurt am Main, Germany"
    - "Bonn, Germany"
    - "Mainz, Germany"
    - "Wiesbaden, Germany"
    - "Rhein-Main, Germany"
    # DACH broader for backup
    - "Berlin, Germany"
    - "Munich, Germany"
    - "Hamburg, Germany"
    - "Vienna, Austria"
    - "Zurich, Switzerland"
    # Remote EU
    - "Remote, Europe"

  country_indeed: "Germany"

  results_wanted: 50             # per query per location
  hours_old: 336                 # 14 days
  job_type: "fulltime"
  distance: 50                   # km radius for location searches
  linkedin_fetch_description: true

# ============================================================
# PROXY (Indeed rate limits)
# ============================================================
proxy:
  enabled: true
  url: "http://USER:PASS@PROXY:PORT"   # populate from .env

# ============================================================
# THROTTLING
# ============================================================
throttling:
  enabled: true
  default_delay: 1.5
  site_delays:
    indeed: 1.0
  jitter: 0.3
  rate_limit_cooldown: 30.0

# ============================================================
# PARALLEL WORKERS
# ============================================================
parallel:
  max_workers: 4

