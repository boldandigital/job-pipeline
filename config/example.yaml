# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║                    JOB SEARCH PIPELINE — CONFIGURATION                       ║
# ╠═══════════════════════════════════════════════════════════════════════════════╣
# ║  Customize search queries, scoring weights, and keywords to match           ║
# ║  your profile. The pipeline uses this config for:                            ║
# ║    1. JobSpy Docker searches (Indeed, LinkedIn)                              ║
# ║    2. Keyword-based scoring                                                  ║
# ║    3. StepStone browser scraper query list                                   ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

# ============================================================
# SEARCH CONFIGURATION
# ============================================================
search:
  sites:
    - "indeed"
    - "linkedin"
    # - "glassdoor"    # Often blocked, enable if it works for you
    # - "google"       # Requires browser scraper, not JobSpy

  locations:
    - "Remote, Germany"
    - "Germany"
    - "Berlin, Germany"       # Change to your city

  country_indeed: "Germany"

  results_wanted: 50          # Per query per location
  hours_old: 336              # 14 days
  job_type: "fulltime"
  distance: 50                # km radius for location searches
  linkedin_fetch_description: true

# ============================================================
# PROXY (recommended for Indeed to avoid rate limits)
# ============================================================
proxy:
  enabled: true
  url: "http://user:pass@proxy-host:12321"    # Replace with your proxy

# ============================================================
# THROTTLING
# ============================================================
throttling:
  enabled: true
  default_delay: 1.5
  site_delays:
    indeed: 1.0
  jitter: 0.3
  rate_limit_cooldown: 30.0

# ============================================================
# PARALLEL WORKERS
# ============================================================
parallel:
  max_workers: 4

# ============================================================
# SEARCH QUERIES — 15 CATEGORIES, ~160 QUERIES
# ============================================================
