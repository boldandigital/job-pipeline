# ============================================================
# SCORING WEIGHTS
# ============================================================
# Positive = boost, negative = penalize. Adjust to your priorities.
scoring:
  threshold: 20

  weights:
    # Location (highest priority)
    fully_remote: 180
    remote_first_culture: 160
    work_from_anywhere: 120
    remote_europe: 100
    remote_general: 80
    preferred_city: 120

    # Work-life balance
    four_day_week: 120
    async_culture: 120
    flexible_hours: 70
    autonomy_culture: 90
    results_only: 100
    unlimited_pto: 40

    # Compensation
    salary_above_target: 70
    equity_options: 20

    # Core skills
    ai_llm_operations: 65
    genai_roles: 60
    ai_implementation: 55
    ai_governance_ethics: 55
    agentic_ai: 50
    prompt_engineering: 50
    automation_specialist: 55
    workflow_automation: 50
    rpa_roles: 45
    revops_gtm: 45
    business_analysis: 40

    # Level fit
    entry_mid_level: 40
    multilingual_bonus: 25
    known_good_companies: 50

    # Negative signals
    office_required: -400
    on_site: -300
    relocation_required: -700
    gig_platforms: -900
    scam_mlm: -800
